services:
  db:
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_USER: goldflow
      POSTGRES_PASSWORD: goldflow_dev
      POSTGRES_DB: goldflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldflow -d goldflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: goldflow
      POSTGRES_PWD: goldflow_dev
      POSTGRES_SEEDS: db
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8233:8080"

volumes:
  pgdata:
